[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripmate"
version = "0.1.0"
description = "A modular AI travel planner"
requires-python = ">=3.11"
dependencies = [
    "langchain-groq>=1.0.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langgraph>=1.0.0,<2.0.0",
    "aiosqlite>=0.20.0",
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]